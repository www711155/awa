<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>حصر كميات مخططات الدفاع المدني</title>
<style>
:root{--bg:#0d1218;--cd:#141b24;--bd:#263140;--tx:#e6eaf0;--mu:#8b97a8;--ac:#d6334f;--ok:#3fb27a;--wn:#e0a94a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:Tahoma,"Segoe UI",Arial,sans-serif;font-size:15px}
main{max-width:1000px;margin:0 auto;padding:18px}h1{font-size:23px;margin:6px 0}.mu{color:var(--mu);font-size:13px}
nav{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0}
nav button{padding:14px 6px;font-size:15px}
button,.btn{font:inherit;color:var(--tx);background:var(--cd);border:1px solid var(--bd);border-radius:8px;padding:8px 14px;cursor:pointer}
button.on{border-color:var(--ac);box-shadow:inset 0 -2px 0 var(--ac)}button.pri{background:var(--ac);border-color:var(--ac)}
.card{background:var(--cd);border:1px solid var(--bd);border-radius:10px;padding:16px;margin-bottom:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
input,select{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:6px;padding:7px 9px;max-width:100%}
input[type=file]{flex:1;min-width:200px}td input[type=number]{width:88px}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:620px}th,td{padding:8px;border-bottom:1px solid var(--bd);text-align:start;font-size:14px}th{color:var(--mu);font-size:12px}
.ok{color:var(--ok)}.wn{color:var(--wn)}.er{color:var(--ac)}.tag{border-radius:99px;padding:2px 9px;font-size:12px;background:var(--bg)}
.tot{max-width:340px;margin-inline-start:auto}.tot div{display:flex;justify-content:space-between;padding:4px 0}
.tot .g{font-weight:700;font-size:17px;border-top:2px solid var(--tx);margin-top:4px;padding-top:8px}
.int{border:1px dashed var(--wn);border-radius:8px;padding:10px;margin-top:12px;font-size:14px}
.cl{display:flex;gap:10px;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--bd);padding:8px 0}.cl img{height:56px;background:#fff;border-radius:4px}
@media print{nav,.np,h1,.mu.top{display:none!important}body{background:#fff;color:#000}.card{border:0;background:#fff}td,th{color:#000}}
</style>
<script src="lib/pdf.js"></script><script src="lib/pdf.worker.js"></script></head><body><main>
<h1>حصر كميات مخططات الدفاع المدني</h1><div class="mu top">نموذج أولي: من ملف DXF أو PDF إلى جدول كميات ثم عرض سعر وفاتورة — الحصر بالذكاء الاصطناعي</div>
<nav id="nav" class="np"></nav><div id="app"></div></main>
<script>
const I=(id,n,u,c,p,kw)=>({id,n,u,c,p,q:0,cf:0,kw,ok:false});
const S={tab:0,unit:.01,disc:0,vat:15,cur:'sp',mk:[],tc:new Set(),pn:1,np:0,msg:'',cli:'',qn:'Q-2026-001',inv:'INV-2026-001',vn:'',key:'',model:'claude-sonnet-5-5',
items:[I('sp','رشاش حريق Sprinkler','عدد',25,38,['sprink','رشاش']),I('sd','كاشف دخان Smoke Detector','عدد',120,185,['smoke','دخان']),I('hd','كاشف حرارة Heat Detector','عدد',110,170,['heat','حرار']),
I('mc','نقطة نداء يدوي MCP','عدد',95,150,['mcp','call','نداء']),I('sn','جرس/فلاش Sounder-Strobe','عدد',140,210,['sounder','strobe','جرس']),I('hc','صندوق حريق Hose Cabinet','عدد',450,650,['hose','fhc','صندوق']),
I('ex','طفاية حريق Extinguisher','عدد',280,390,['ext','طفاي']),I('p2','ماسورة 2" Pipe','م',38,55,[]),I('p4','ماسورة 4" Pipe','م',85,120,[]),I('vl','محبس Valve','عدد',210,320,['valve','محبس']),
I('es','لوحة مخرج Exit Sign','عدد',60,95,['exit','مخرج']),I('el','إنارة طوارئ Emergency Light','عدد',75,120,['emerg','إنارة'])]};
S.method='lib';S.cl=[];S.lib=[];S.ex=[];
try{S.lib=JSON.parse(localStorage.getItem('lib')||'[]')}catch(e){}
try{S.key=localStorage.getItem('k')||'';S.model=localStorage.getItem('m')||S.model}catch(e){}
const $=s=>document.querySelector(s),f=n=>(+n||0).toLocaleString('en-US',{maximumFractionDigits:2}),W=t=>`<span class="wn">${t}</span>`,G=t=>`<span class="ok">${t}</span>`;
let PDF=null,IMG=null;const PG={};
const rev=i=>i.q>0&&i.cf<85&&!i.ok;
function T(){let s=0,c=0;S.items.forEach(i=>{s+=i.q*i.p;c+=i.q*i.c});const d=s*S.disc/100,n=s-d,v=n*S.vat/100;return{s,c,d,n,v,t:n+v,pr:n-c,mg:n?(n-c)/n*100:0}}
function tots(int){const t=T();return `<div class="tot"><div><span>المجموع</span><span>${f(t.s)}</span></div><div><span>الخصم (${S.disc}%)</span><span>${f(t.d)}</span></div><div><span>قبل الضريبة</span><span>${f(t.n)}</span></div><div><span>ضريبة القيمة المضافة ${S.vat}%</span><span>${f(t.v)}</span></div><div class="g"><span>الإجمالي النهائي (ريال)</span><span>${f(t.t)}</span></div></div>`+(int?`<div class="int">🔒 داخلي فقط: التكلفة ${f(t.c)} — صافي الربح <b>${f(t.pr)}</b> — الهامش <b>${f(t.mg)}%</b></div>`:'')}
function upd(){S.items.forEach((i,k)=>{const e=$('#rt'+k);if(e)e.textContent=f(i.q*i.p);const q=$('#q'+k);if(q&&document.activeElement!==q)q.value=i.q});
const a=$('#tb');if(a)a.innerHTML=tots(1);const b=$('#qt');if(b)b.innerHTML=tots(0);const r=$('#rvn');if(r)r.textContent=S.items.filter(rev).length}
function go(n){S.tab=n;render()}
function keep(){const y=scrollY;render();scrollTo(0,y)}
function render(){$('#nav').innerHTML=['رفع المخطط','جدول الكميات','عرض السعر','الفاتورة'].map((t,i)=>`<button class="${S.tab==i?'on':''}" onclick="go(${i})">${t}</button>`).join('');
$('#app').innerHTML=[up,tbl,()=>doc('عرض سعر',S.qn,'qn'),()=>doc('فاتورة ضريبية',S.inv,'inv')][S.tab]();upd();if(S.tab==0&&S.np)drawV()}
function up(){return `<div class="card"><div class="row"><input type="file" accept=".dxf,.pdf,.png,.jpg,.jpeg" onchange="loadF(this.files[0])"><button onclick="demo()">جرّب مخططًا تجريبيًا</button></div>
<div class="row"><label>وحدة الرسم <select onchange="S.unit=+this.value"><option value=".001" ${S.unit==.001?'selected':''}>مليمتر</option><option value=".01" ${S.unit==.01?'selected':''}>سنتيمتر</option><option value="1" ${S.unit==1?'selected':''}>متر</option></select></label></div>
<p class="mu">DXF: حصر آلي دقيق وسريع. PDF والصور: حصر بالذكاء الاصطناعي (يحلل المخطط ويضع علامة على كل عنصر) ثم تراجعه بصريًا. DWG احفظه DXF.</p>
<div class="row"><b>طريقة الحصر:</b>${[['lib','📖 مكتبة الرموز'],['auto','🔍 اكتشاف تلقائي'],['ai','🤖 ذكاء اصطناعي'],['man','✋ يدوي']].map(([k,t])=>`<button class="${S.method==k?'on':''}" onclick="S.method='${k}';keep()">${t}</button>`).join('')}</div>
${S.method=='lib'?LIBP():S.method=='ai'?`<div class="row"><b>🤖 الذكاء الاصطناعي</b><input type="password" placeholder="مفتاح Anthropic API" value="${S.key}" style="flex:1;min-width:200px" onchange="S.key=this.value.trim();try{localStorage.setItem('k',S.key)}catch(e){}">
<input value="${S.model}" style="width:170px" onchange="S.model=this.value.trim();try{localStorage.setItem('m',S.model)}catch(e){}"><button class="pri" onclick="aiRun()">حصر بالذكاء الاصطناعي</button></div>`:S.method=='auto'?'<div class="row"><button class="pri" onclick="autoDetect()">ابدأ المطابقة التلقائية</button><span class="mu">يكتشف كل الرموز المتكررة في المخطط ويعرضها، فتسمّي كل نوع مرة واحدة ويُحصى كله.</span></div>':'<div class="mu">انقر على كل رمز لحصره، أو استخدم «🎯 تعلّم رمز بالسحب».</div>'}
<p id="msg" style="margin:8px 0 0">${S.msg}</p>${S.cl.length?`<div style="margin-top:10px"><b>رموز مكتشفة (${S.cl.length})</b> <button class="pri" onclick="accAll()">اعتماد كل المسمّى</button>
${S.cl.map((c,k)=>`<div class="cl"><img src="${c.img}"><b>×${c.m.length}</b><select id="cs${k}"><option value="">— اختر الصنف —</option>${S.items.map(i=>`<option value="${i.id}">${i.n}</option>`).join('')}</select><button onclick="acc(${k})">اعتماد</button><button onclick="S.cl.splice(${k},1);keep()">تجاهل</button></div>`).join('')}</div>`:''}</div>
${S.np?`<div class="card"><div class="row"><b>المخطط</b><select onchange="S.cur=this.value">${S.items.map(i=>`<option value="${i.id}" ${S.cur==i.id?'selected':''}>${i.n}</option>`).join('')}</select>
<button onclick="pgGo(-1)">◀</button><span>${S.pn}/${S.np}</span><button onclick="pgGo(1)">▶</button><button class="${S.learn?'on':''}" onclick="S.learn=S.learn?0:'sym';keep()">🎯 تعريف رمز</button><button onclick="S.mk.pop();syncQ();keep()">تراجع</button><button onclick="S.mk=[];S.tc=new Set();S.items.forEach(i=>i.q=0);keep()">مسح</button><span class="mu">العلامات: ${S.mk.length} (🔵 ذكاء اصطناعي، 🟢 اكتشاف، 🟣 مكتبة، 🔴 يدوي)</span></div>
<div class="tw"><canvas id="cv" style="max-width:100%;cursor:crosshair;touch-action:none" onclick="mark(event)" onpointerdown="ds(event)" onpointerup="de(event)"></canvas></div>${S.learn=='sym'?'<div class="wn">🎯 اختر الصنف من القائمة ثم اسحب مستطيلًا ضيقًا حول رمز واحد (من الجدول أو المخطط) ليُضاف إلى المكتبة.</div>':S.learn=='ex'?'<div class="wn">🚫 اسحب مستطيلًا حول جدول الرموز أو الختم لاستثنائه من الحصر.</div>':''}<div class="mu">للتصحيح: اختر الصنف وانقر على الرمز الناقص؛ وللحذف انقر بزر الفأرة الأيمن على العلامة.</div></div>`:''}`}
const nm=id=>(S.items.find(i=>i.id==id)||{}).n;
function LIBP(){return `<div class="row"><button onclick="legendRead()">📖 قراءة جدول الرموز من المخطط</button><button onclick="legendAI()">🤖 قراءته بالذكاء الاصطناعي</button><button class="${S.learn=='sym'?'on':''}" onclick="S.learn=S.learn=='sym'?0:'sym';keep()">🎯 تعريف رمز بالسحب</button><button class="${S.learn=='ex'?'on':''}" onclick="S.learn=S.learn=='ex'?0:'ex';keep()">🚫 استثناء منطقة</button><button class="pri" onclick="runLib()">🔎 حصر بالمكتبة</button></div>
<div class="row"><input type="password" placeholder="مفتاح API (للقراءة بالذكاء الاصطناعي فقط)" value="${S.key}" style="flex:1;min-width:200px" onchange="S.key=this.value.trim();try{localStorage.setItem('k',S.key)}catch(e){}"></div>
<div class="mu">تُقرأ رموز الجدول المرفق بالمخطط (من النص أو بالذكاء الاصطناعي) أو تعرّفها أنت بالسحب، ثم يُحصى كل ما يطابقها. مكتبتك (<b>${S.lib.length}</b> رمز):</div>
<div class="row">${S.lib.map((e,k)=>`<div class="cl" style="border:0"><img src="${e.img}"><span>${nm(e.id)}</span><button onclick="S.lib.splice(${k},1);saveLib();keep()">✕</button></div>`).join('')||'<span class="mu">فارغة.</span>'}</div>`}
function tbl(){return `<div class="card"><div class="tw"><table><tr><th>#</th><th>الصنف</th><th>الوحدة</th><th>الكمية</th><th>سعر الشراء</th><th>سعر البيع</th><th>الإجمالي</th><th>الثقة</th></tr>
${S.items.map((i,k)=>`<tr><td>${k+1}</td><td>${i.n}</td><td>${i.u}</td><td><input type="number" min="0" id="q${k}" value="${i.q}" oninput="S.items[${k}].q=+this.value;upd()"></td>
<td><input type="number" min="0" value="${i.c}" oninput="S.items[${k}].c=+this.value;upd()"></td><td><input type="number" min="0" value="${i.p}" oninput="S.items[${k}].p=+this.value;upd()"></td><td id="rt${k}"></td>
<td>${!i.q?'-':rev(i)?`<button onclick="S.items[${k}].ok=true;render()">⚠️ ${i.cf}% اعتماد</button>`:`<span class="tag ok">✔ ${i.cf||100}%</span>`}</td></tr>`).join('')}</table></div>
<div class="row" style="margin-top:10px"><label>خصم % <input type="number" min="0" max="100" value="${S.disc}" style="width:70px" oninput="S.disc=+this.value;upd()"></label><span>تحتاج مراجعة: <b id="rvn" class="wn"></b></span></div><div id="tb"></div></div>`}
function doc(title,no,key){const r=S.items.filter(i=>i.q>0);return `<div class="row np"><input placeholder="اسم العميل" value="${S.cli}" onchange="S.cli=this.value;render()"><input value="${no}" style="width:140px" onchange="S['${key}']=this.value;render()">
${key=='inv'?`<input placeholder="الرقم الضريبي" value="${S.vn}" onchange="S.vn=this.value;render()">`:''}<button class="pri" onclick="print()">طباعة / حفظ PDF</button></div>
<div class="card"><div class="row" style="justify-content:space-between"><h2 style="margin:0;color:var(--ac)">${title}</h2><div>الرقم: ${no}<br>التاريخ: ${new Date().toLocaleDateString('en-GB')}</div></div>
<p><b>العميل:</b> ${S.cli||'—'} ${key=='inv'&&S.vn?` &nbsp; <b>الرقم الضريبي:</b> ${S.vn}`:''}</p>${r.length?`<div class="tw"><table><tr><th>#</th><th>الوصف</th><th>الوحدة</th><th>الكمية</th><th>سعر الوحدة</th><th>الإجمالي</th></tr>
${r.map((i,k)=>`<tr><td>${k+1}</td><td>${i.n}</td><td>${i.u}</td><td>${f(i.q)}</td><td>${f(i.p)}</td><td>${f(i.q*i.p)}</td></tr>`).join('')}</table></div><div id="qt" style="margin-top:12px"></div>`:'<p class="mu">لا توجد كميات بعد. ارفع مخططًا أولًا.</p>'}
${key=='qn'?'<h4>الشروط</h4><ul class="mu"><li>العرض ساري 15 يومًا.</li><li>الأسعار بالريال السعودي.</li><li>الدفع: 50% مقدمًا والباقي عند الاستلام.</li></ul>':''}
<div class="row" style="justify-content:space-between;margin-top:26px"><span>التوقيع: ________</span><span>الختم</span></div></div>`}
/* ---- ملفات ---- */
function reset(){S.items.forEach(i=>{i.q=0;i.cf=0;i.ok=false});S.mk=[];S.tc=new Set();S.cl=[];S.ex=[];S.lib=S.lib.filter(e=>!e.leg)}
function loadF(file){if(!file)return;const n=file.name;if(/\.pdf$/i.test(n))return loadPDF(file);if(/\.(png|jpe?g)$/i.test(n))return loadImg(file);
if(!/\.dxf$/i.test(n)){S.msg=W('⚠️ صيغة غير مدعومة. استخدم DXF أو PDF أو صورة (DWG احفظه DXF).');return render()}
const r=new FileReader();r.onload=()=>{try{S.np=0;applyDXF(parseDXF(r.result))}catch(e){S.msg=W('تعذر قراءة الملف.');render()}};r.readAsText(file)}
function parseDXF(t){const L=t.split(/\r?\n/),o=[];let e=null,on=false;for(let i=0;i+1<L.length;i+=2){const c=+L[i].trim(),v=L[i+1].trim();
if(c==0){if(v=='ENDSEC'||v=='SECTION'){on=false;e=null;continue}e=on?{t:v,p:[],x:null}:null;if(e)o.push(e);continue}
if(c==2&&v=='ENTITIES'&&!e){on=true;continue}if(!e)continue;
if(c==8)e.l=v;else if(c==2&&!e.n)e.n=v;else if(c==10||c==11)e.x=+v;else if(c==20||c==21)e.p.push([e.x,+v])}return o}
function applyDXF(es,demoMsg){reset();const pm={p2:0,p4:0},d=(a,b)=>Math.hypot(a[0]-b[0],a[1]-b[1]);
es.forEach(e=>{const s=((e.n||'')+' '+(e.l||'')).toLowerCase();if(e.t=='INSERT'){const it=S.items.find(i=>i.kw.some(k=>s.includes(k)));if(it){it.q++;it.cf=95}}
else if(/pipe|ماسورة|مواسير/.test(s)&&(e.t=='LINE'||e.t=='LWPOLYLINE')){let l=0;for(let k=1;k<e.p.length;k++)l+=d(e.p[k-1],e.p[k]);pm[/4|100|6|150/.test(e.l||'')?'p4':'p2']+=l*S.unit}});
['p2','p4'].forEach(k=>{const it=S.items.find(i=>i.id==k);it.q=Math.round(pm[k]*10)/10;it.cf=it.q?70:0});
const n=S.items.filter(i=>i.q>0).length;S.msg=n?G(`✔ ${demoMsg?'مخطط تجريبي — ':''}تم حصر ${n} صنف من DXF. راجع النتائج في «جدول الكميات».`):W('لم يتم العثور على رموز معروفة. تأكد من أسماء البلوكات/الطبقات.');render()}
function demo(){const a=[],A=(...x)=>a.push(...x);A(0,'SECTION',2,'ENTITIES');for(let k=0;k<10;k++)A(0,'INSERT',8,'FP-SPRINKLER',2,'SPRINKLER',10,k*1000,20,500);
for(let k=0;k<5;k++)A(0,'INSERT',8,'FP-DETECTORS',2,'SMOKE_DET',10,k*1500,20,3000);for(let k=0;k<2;k++)A(0,'INSERT',8,'FP-EXTINGUISHER',2,'EXT_CO2',10,k*800,20,100);
A(0,'LWPOLYLINE',8,'FP-PIPE-2',90,3,10,0,20,0,10,12000,20,0,10,12000,20,8000,0,'ENDSEC',0,'EOF');S.np=0;S.unit=.001;applyDXF(parseDXF(a.join('\n')),1)}
async function getPage(n){if(PG[n])return PG[n];let c;if(IMG)c=IMG;else{const pg=await PDF.getPage(n),v1=pg.getViewport({scale:1}),sc=Math.min(3,2000/Math.max(v1.width,v1.height)),vp=pg.getViewport({scale:sc});
c=document.createElement('canvas');c.width=vp.width;c.height=vp.height;await pg.render({canvasContext:c.getContext('2d'),viewport:vp}).promise}return PG[n]=c}
async function showPage(n){S.pn=n;await getPage(n);keep()}
function pgGo(d){const n=S.pn+d;if(n>=1&&n<=S.np)showPage(n)}
function loadImg(file){const im=new Image();im.onload=async()=>{const c=document.createElement('canvas');c.width=im.width;c.height=im.height;c.getContext('2d').drawImage(im,0,0);
for(const k in PG)delete PG[k];IMG=c;PDF=null;S.np=1;S.pn=1;reset();await getPage(1);S.msg=G('✔ تم فتح الصورة.');render();autoAI()};im.onerror=()=>{S.msg=W('تعذر فتح الصورة.');render()};im.src=URL.createObjectURL(file)}
async function loadPDF(file){S.msg='⏳ جاري قراءة المخطط...';render();
try{if(!window.pdfjsLib)throw new Error('lib/pdf.js غير موجود بجانب index.html');PDF=await pdfjsLib.getDocument({data:new Uint8Array(await file.arrayBuffer()),isEvalSupported:false}).promise;
for(const k in PG)delete PG[k];IMG=null;S.np=PDF.numPages;S.pn=1;reset();await getPage(1);const tc=await textCount();S.msg=G(`✔ تم فتح ${S.np} صفحة.`)+' '+(tc.n?G(`عُثر على ${tc.n} صنف من النصوص (قد تشمل جدول المفاتيح، راجعها).`):tc.tx?W('في الملف نصوص لكنها لا تطابق أسماء الأصناف.'):W('المخطط صورة/ممسوح بدون نصوص قابلة للقراءة.'));render();autoAI()}
catch(e){console.error(e);S.np=0;S.msg=`<span class="er">⚠️ تعذر فتح الـPDF (${e&&e.message||e}). جرّب صورة للمخطط.</span>`;render()}}
function autoAI(){if(S.method=='lib')libFlow();else if(S.method=='auto')autoDetect();else if(S.method=='ai'&&S.key)aiRun();else if(S.method=='man'){render()}else{S.msg+='<br>'+W('للحصر الآلي بدون مفتاح: اضغط «🎯 تعلّم رمز بالسحب» وحدّد رمزًا واحدًا. أو أدخل مفتاح API للحصر بالذكاء الاصطناعي.');render()}}
/* ---- العلامات ---- */

function gray(cv,s,bl){const t=document.createElement('canvas');t.width=Math.round(cv.width*s);t.height=Math.round(cv.height*s);const g=t.getContext('2d');if(bl)g.filter='blur('+bl+'px)';g.drawImage(cv,0,0,t.width,t.height);

function saveLib(){try{localStorage.setItem('lib',JSON.stringify(S.lib.filter(e=>!e.leg).map(e=>({id:e.id,img:e.img}))))}catch(e){}}
function tplCv(e){return e.cv?Promise.resolve(e.cv):new Promise(r=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=im.width;c.height=im.height;c.getContext('2d').drawImage(im,0,0);e.cv=c;r(c)};im.src=e.img})}
function addSym(id,B,x0,y0,x1,y1,p,leg){x0=Math.max(0,Math.floor(x0));y0=Math.max(0,Math.floor(y0));x1=Math.min(B.width,Math.ceil(x1));y1=Math.min(B.height,Math.ceil(y1));const w=x1-x0,h=y1-y0;if(w<8||h<8)return null;
const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(B,x0,y0,w,h,0,0,w,h);const e={id,img:c.toDataURL(),cv:c,leg:leg?1:0,src:{p,x:(x0+x1)/2/B.width,y:(y0+y1)/2/B.height}};S.lib.push(e);if(!leg)saveLib();return e}
function bbs(g){const w=g.w,h=g.h,bin=new Uint8Array(w*h),st=new Int32Array(w*h),o=[];for(let i=0;i<bin.length;i++)bin[i]=g.o[i]<170?1:0;
for(let i0=0;i0<bin.length&&o.length<30000;i0++){if(bin[i0]!=1)continue;let sp=0,x0=1e9,y0=1e9,x1=-1,y1=-1;st[sp++]=i0;bin[i0]=2;
while(sp){const i=st[--sp],x=i%w,y=(i/w)|0;if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y;for(let dy=-1;dy<=1;dy++){const yy=y+dy;if(yy<0||yy>=h)continue;for(let dx=-1;dx<=1;dx++){const xx=x+dx,j=yy*w+xx;if(xx>=0&&xx<w&&bin[j]==1){bin[j]=2;st[sp++]=j}}}}
const bw=x1-x0+1,bh=y1-y0+1;if(bw>=6&&bh>=6&&bw<=150&&bh<=150)o.push([x0,y0,x1,y1])}return o}
async function legendRead(auto){if(!PDF){if(!auto){S.msg=W('القراءة من النص تتطلب PDF يحتوي نصوصًا. جرّب «قراءته بالذكاء الاصطناعي» أو عرّف الرموز بالسحب.');render()}return 0}
S.lib=S.lib.filter(e=>!e.leg);S.ex=S.ex.filter(r=>!r.leg);const got={};let n=0;
if(!auto){S.msg='⏳ قراءة جدول الرموز...';render();await new Promise(r=>setTimeout(r,30))}
for(let p=1;p<=Math.min(S.np,10);p++){const pg=await PDF.getPage(p),vp=pg.getViewport({scale:1}),B=await getPage(p),k=B.width/vp.width,tc=await pg.getTextContent(),labs=[];
tc.items.forEach(t=>{const x=t.str.toLowerCase();if(!x.trim())return;const it=S.items.find(i=>i.u=='عدد'&&i.kw.some(w=>x.includes(w)));if(it&&!got[it.id])labs.push({it,t})});if(!labs.length)continue;
const cs=bbs(gray(B,1));let rx0=1e9,ry0=1e9,rx1=0,ry1=0,np=0;
for(const {it,t} of labs){if(got[it.id])continue;const [px,py]=vp.convertToViewportPoint(t.transform[4],t.transform[5]),L=px*k,R=L+t.width*k,h=Math.max(10,(t.height||10)*k),ym=py*k-h/2;let best=null,bd=1e9;
for(const c of cs){const cy=(c[1]+c[3])/2;if(Math.abs(cy-ym)>Math.max(h,16)||Math.max(c[2]-c[0],c[3]-c[1])<h*.95)continue;const gap=c[2]<L?L-c[2]:c[0]>R?c[0]-R:1e9;if(gap<bd&&gap<=120){bd=gap;best=c}}
if(best&&addSym(it.id,B,best[0]-2,best[1]-2,best[2]+3,best[3]+3,p,1)){got[it.id]=1;n++;np++;rx0=Math.min(rx0,best[0],L);ry0=Math.min(ry0,best[1]);rx1=Math.max(rx1,best[2],R);ry1=Math.max(ry1,best[3])}}
if(np>=2)S.ex.push({p,x0:Math.max(0,rx0-40)/B.width,y0:Math.max(0,ry0-40)/B.height,x1:Math.min(B.width,rx1+40)/B.width,y1:Math.min(B.height,ry1+40)/B.height,leg:1})}

S.lib=S.lib.filter(e=>!e.leg);S.ex=S.ex.filter(r=>!r.leg);let n=0;const cu=`هذه صفحة من مخطط حريق وسلامة. ابحث عن جدول الرموز (Legend) إن وُجد، وأعد لكل بند يطابق أحد الأصناف مستطيل الرمز وحده (دون النص المجاور) ملتصقًا به بدقة، ومستطيل الجدول كاملًا.

async function runLib(){if(!S.np||!S.lib.length){S.msg=W('مكتبة الرموز فارغة: اقرأ جدول الرموز أو عرّف رمزًا بالسحب أولًا.');return render()}
S.msg='⏳ الحصر بالمكتبة...';render();await new Promise(r=>setTimeout(r,30));
try{S.mk=S.mk.filter(m=>m.ai!=3);const N=Math.min(S.np,10),TH=.72,sc={},cn={};
for(let p=1;p<=N;p++){const m=$('#msg');if(m)m.textContent=`⏳ مطابقة صفحة ${p}/${N}...`;await new Promise(r=>setTimeout(r,0));
const B=await getPage(p),s=Math.min(1,900/Math.max(B.width,B.height)),g=gray(B,s,.8);
for(const e of S.lib){const T=gray(await tplCv(e),s,.8),tw=T.w,th=T.h;if(tw<6||th<6||tw>g.w/2||th>g.h/2)continue;

const n=pts.length;let ts=0,tq=0;pts.forEach(q=>{ts+=q[2];tq+=q[2]*q[2]});const tm=ts/n,tsd=Math.sqrt(tq/n-tm*tm);if(tsd<5)continue;
const ncc=(x,y)=>{let sum=0,sq=0,sx=0;for(let k=0;k<n;k++){const q=pts[k],v=g.o[(y+q[1])*g.w+x+q[0]];sum+=v;sq+=v*v;sx+=v*q[2]}const mm=sum/n,vr=sq/n-mm*mm;return vr<25?-1:(sx/n-mm*tm)/(Math.sqrt(vr)*tsd)};
const chrom=(D,w,ox,oy)=>{let r=0,gg=0,b=0;for(const q of pts){const i=((oy+q[1])*w+ox+q[0])*4,wt=765-D[i]-D[i+1]-D[i+2];r+=D[i]*wt;gg+=D[i+1]*wt;b+=D[i+2]*wt}const t=r+gg+b||1;return[r/t,gg/t,b/t]},tcol=chrom(T.d,tw,0,0);
const res=[];for(let y=0;y+th<=g.h;y+=2)for(let x=0;x+tw<=g.w;x+=2){let bc=ncc(x,y);if(bc<.55)continue;let bx=x,by=y;
for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){const nx=x+dx,ny=y+dy;if(nx<0||ny<0||nx+tw>g.w||ny+th>g.h)continue;const c=ncc(nx,ny);if(c>bc){bc=c;bx=nx;by=ny}}
if(bc>TH){const wc=chrom(g.d,g.w,bx,by);if(Math.hypot(wc[0]-tcol[0],wc[1]-tcol[1],wc[2]-tcol[2])<.15)res.push([bc,bx,by])}}
res.sort((a,b)=>b[0]-a[0]);const dmin=.5*Math.max(tw,th),acc=[];
for(const r of res){if(acc.length>=500)break;const cx=(r[1]+tw/2)/g.w,cy=(r[2]+th/2)/g.h;
if(S.lib.some(q=>q.src.p==p&&Math.abs(q.src.x-cx)*g.w<tw&&Math.abs(q.src.y-cy)*g.h<th))continue;
if(S.ex.some(q=>q.p==p&&cx>=q.x0&&cx<=q.x1&&cy>=q.y0&&cy<=q.y1))continue;
if(acc.some(q=>Math.hypot(q[1]-r[1],q[2]-r[2])<dmin))continue;
if(S.mk.some(q=>q.p==p&&q.id==e.id&&Math.hypot((q.x-cx)*g.w,(q.y-cy)*g.h)<dmin))continue;acc.push(r)}
acc.forEach(r=>{S.mk.push({p,x:(r[1]+tw/2)/g.w,y:(r[2]+th/2)/g.h,id:e.id,ai:3});sc[e.id]=(sc[e.id]||0)+r[0];cn[e.id]=(cn[e.id]||0)+1})}}
const ids=[...new Set(S.lib.map(e=>e.id))];ids.forEach(id=>{S.tc.add(id)});syncQ();ids.forEach(id=>{const it=S.items.find(i=>i.id==id);it.cf=cn[id]?Math.round(sc[id]/cn[id]*100):0;it.ok=false});
S.msg=G(`✔ الحصر بالمكتبة: ${ids.map(id=>nm(id).split(' ')[0]+' '+(cn[id]||0)).join('، ')}. راجع العلامات 🟣 على المخطط.`)}
catch(e){console.error(e);S.msg=`<span class="er">⚠️ ${e.message}</span>`}render()}

function accAll(){for(let k=S.cl.length-1;k>=0;k--)acc(k,1);S.msg=G('✔ تم اعتماد الرموز المسمّاة. راجع العلامات 🟢 على المخطط.');keep()}
async function autoDetect(){if(!S.np){S.msg=W('ارفع مخططًا PDF أو صورة أولًا (DXF يُحصى تلقائيًا).');return render()}
S.msg='⏳ اكتشاف الرموز المتكررة...';render();await new Promise(r=>setTimeout(r,40));
try{const N=Math.min(S.np,10),reps=[];
for(let p=1;p<=N;p++){const m=$('#msg');if(m)m.textContent=`⏳ تحليل صفحة ${p}/${N}...`;await new Promise(r=>setTimeout(r,0));
const B=await getPage(p),sc=Math.min(1,1600/Math.max(B.width,B.height)),g=gray(B,sc),w=g.w,h=g.h,bin=new Uint8Array(w*h);for(let i=0;i<bin.length;i++)bin[i]=g.o[i]<170?1:0;
const st=new Int32Array(w*h),px=new Int32Array(w*h);
for(let i0=0;i0<bin.length;i0++){if(bin[i0]!=1)continue;let sp=0,n=0,x0=1e9,y0=1e9,x1=-1,y1=-1;st[sp++]=i0;bin[i0]=2;
while(sp){const i=st[--sp];px[n++]=i;const x=i%w,y=(i/w)|0;if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y;
for(let dy=-1;dy<=1;dy++){const yy=y+dy;if(yy<0||yy>=h)continue;for(let dx=-1;dx<=1;dx++){const xx=x+dx;if(xx<0||xx>=w)continue;const j=yy*w+xx;if(bin[j]==1){bin[j]=2;st[sp++]=j}}}}
const bw=x1-x0+1,bh=y1-y0+1;if(bw<6||bh<6||bw>70||bh>70||n<15||n/(bw*bh)<.08)continue;
const v=new Float32Array(144);let sr=0,sg=0,sb=0;for(let q=0;q<n;q++){const x=px[q]%w,y=(px[q]/w)|0;v[((((y-y0)*12/bh)|0)*12)+(((x-x0)*12/bw)|0)]++;const o4=px[q]*4;sr+=g.d[o4];sg+=g.d[o4+1];sb+=g.d[o4+2]}const col=[sr/n,sg/n,sb/n];
let nm=0;for(let q=0;q<144;q++)nm+=v[q]*v[q];nm=Math.sqrt(nm)||1;for(let q=0;q<144;q++)v[q]/=nm;
let best=null,bs=.9;for(const r of reps){if(Math.abs(bw-r.w)>Math.max(2,.15*r.w)||Math.abs(bh-r.h)>Math.max(2,.15*r.h)||Math.hypot(col[0]-r.c[0],col[1]-r.c[1],col[2]-r.c[2])>70)continue;let d=0;for(let q=0;q<144;q++)d+=v[q]*r.v[q];if(d>=bs){bs=d;best=r}}
const mem={p,x:(x0+bw/2)/w,y:(y0+bh/2)/h};
if(best){best.m.push(mem);best.s+=bs}else if(reps.length<800){const t=document.createElement('canvas'),pad=3,k=56/(bh+2*pad);t.width=Math.max(8,Math.round((bw+2*pad)*k));t.height=56;
t.getContext('2d').drawImage(B,(x0-pad)/sc,(y0-pad)/sc,(bw+2*pad)/sc,(bh+2*pad)/sc,0,0,t.width,t.height);reps.push({v,c:col,w:bw,h:bh,m:[mem],s:1,img:t.toDataURL()})}}}
S.cl=reps.filter(r=>r.m.length>=3).sort((a,b)=>b.m.length*Math.pow(b.w*b.h,1.5)-a.m.length*Math.pow(a.w*a.h,1.5)).slice(0,20).map(r=>({img:r.img,m:r.m,sim:r.s/r.m.length}));
S.msg=S.cl.length?G(`✔ تم اكتشاف ${S.cl.length} نوع رمز متكرر. اختر لكل نوع الصنف المناسب ثم «اعتماد» (تجاهل ما ليس رمزًا مثل الحروف).`):W('لم تُكتشف رموز متكررة. جرّب «تعلّم رمز بالسحب» أو الذكاء الاصطناعي. (الرموز الملتصقة بخطوط المواسير قد لا تُكتشف.)')}
catch(e){console.error(e);S.msg=`<span class="er">⚠️ ${e.message}</span>`}render()}
render();
</script></body></html>
