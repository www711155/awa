V.products=()=>`<div class="row"><button class="p" onclick="ep()">➕ إضافة منتج</button></div><div class="c">${tbl(['الكود','المنتج','التصنيف','الشراء','البيع','الهامش','المخزون','الحد','مقترح الشراء','المورد',''],D.p.map(p=>{const s=stock(p);return Object.assign([esc(p.code),esc(p.name),esc(p.cat),fm(p.buy),fm(p.sell),(p.sell?((p.sell-p.buy)/p.sell*100).toFixed(1)+'%':'—'),s,p.min,sug(p)||'—',esc(nm(D.s,p.sup)),`<button onclick="ep('${p.id}')">تعديل</button> <button onclick="mv('${p.id}')">حركة</button> <button onclick="bc('${p.id}')">باركود</button> <button onclick="jd('${p.id}')">جرد</button> ${canDel()?`<button class="d" onclick="dp('${p.id}')">حذف</button>`:''}`],{w:s<=p.min})}))}</div>`;
function ep(i){const p=D.p.find(x=>x.id==i)||{};form(i?'تعديل منتج':'إضافة منتج',[['name','الاسم','text',0,p.name],['code','الكود / الباركود (أحرف إنجليزية وأرقام)','text',0,p.code],['cat','التصنيف','text',0,p.cat],['buy','سعر الشراء','number',0,p.buy],['sell','سعر البيع','number',0,p.sell],['q0','الكمية الافتتاحية','number',0,p.q0||0],['min','حد إعادة الطلب','number',0,p.min??3],['sup','المورد','sel',[['','—'],...D.s.map(s=>[s.id,s.name])],p.sup]],o=>{if(i)Object.assign(p,o);else D.p.push({id:id(),...o})})}
const dp=i=>{if(confirm('حذف المنتج؟')){D.p=D.p.filter(p=>p.id!=i);save();render()}};
function jd(i){const p=D.p.find(x=>x.id==i);form('جرد: '+p.name,[['q','الكمية الفعلية','number',0,stock(p)]],o=>{p.q0+=o.q-stock(p)})}
function mv(i){const p=D.p.find(x=>x.id==i);mo(`<h2>حركة الصنف: ${esc(p.name)}</h2>`+tbl(['التاريخ','المستند','الكمية'],D.d.filter(d=>SS[d.t]&&d.L.some(l=>l.p==i)).map(d=>[d.date,d.no+' '+T[d.t],SS[d.t]*d.L.filter(l=>l.p==i).reduce((a,l)=>a+l.q,0)]))+`<p><button onclick="mc()">إغلاق</button></p>`)}
const C39={'0':'000110100','1':'100100001','2':'001100001','3':'101100000','4':'000110001','5':'100110000','6':'001110000','7':'000100101','8':'100100100','9':'001100100',A:'100001001',B:'001001001',C:'101001000',D:'000011001',E:'100011000',F:'001011000',G:'000001101',H:'100001100',I:'001001100',J:'000011100',K:'100000011',L:'001000011',M:'101000010',N:'000010011',O:'100010010',P:'001010010',Q:'000000111',R:'100000110',S:'001000110',T:'000010110',U:'110000001',V:'011000001',W:'111000000',X:'010010001',Y:'110010000',Z:'011010000','-':'010000101','*':'010010100'};
function b39(c){let x=0,s='';('*'+c.toUpperCase().replace(/[^0-9A-Z-]/g,'')+'*').split('').forEach(ch=>{(C39[ch]||'').split('').forEach((w,i)=>{const wd=w=='1'?3:1;if(i%2==0)s+=`<rect x="${x}" width="${wd}" height="40"/>`;x+=wd});x+=1});return`<svg viewBox="0 0 ${x} 40" style="width:100%;height:40px" fill="#000">${s}</svg>`}
function bc(i){const p=D.p.find(x=>x.id==i);mo(`<div class="bc">${[...Array(9)].map(()=>`<div>${esc(p.name)}${b39(p.code)}${esc(p.code)} — ${fm(p.sell)}</div>`).join('')}</div><p class="noprint"><button class="p" onclick="print()">🖨️ طباعة الباركود</button> <button onclick="mc()">إغلاق</button></p>`)}

const cte=i=>{const c=D.ct.find(x=>x.id==i)||{};form(i?'تعديل العقد':'عقد جديد',[['client','العميل','sel',D.c.map(x=>[x.id,x.name]),c.client],['type','نوع الخدمة','sel',CTY.map(x=>[x,x]),c.type],['val','قيمة العقد','number',0,c.val||0],['start','بداية العقد','date',0,c.start||today()],['end','نهاية العقد','date',0,c.end],['eq','الأجهزة والمعدات (افصل بفاصلة)','text',0,c.eq],['note','مراجع المستندات / ملاحظات','text',0,c.note]],o=>{if(!o.client||!o.end||o.end<o.start){toast('تحقق من العميل وتواريخ العقد');return false}if(i)Object.assign(c,o);else D.ct.push({id:id(),visits:[],...o})})};
const cpay=i=>{const c=D.ct.find(x=>x.id==i);form('دفعة عقد',[['a','المبلغ','number'],['pay','الطريقة','sel',['نقدي','شبكة','تحويل'].map(x=>[x,x])],['acct','الحساب','sel',banksOpt()]],o=>{if(o.a>c.val-cpaid(c)+.001){toast('المبلغ أكبر من المتبقي على العقد');return false}gen('cr',{a:o.a,pay:o.pay,acct:o.pay=='نقدي'?'cash':o.acct,note:'دفعة عقد '+nm(D.k,c.client)});D.d[D.d.length-1].ct=i;alog('دفعة عقد')})};
function ctd(i){const c=D.ct.find(x=>x.id==i);mo(`<h2>${esc(nm(D.k,c.client))} — ${esc(c.type)}</h2><p>${c.start} ← ${c.end} | القيمة ${fm(c.val)} | المستندات: ${esc(c.note)}</p><h3>الأجهزة والمعدات</h3><p>${esc(c.eq||'—')}</p><h3>الدفعات</h3>${tbl(['الرقم','التاريخ','المبلغ',''],D.d.filter(d=>d.t=='cr'&&d.ct==i).map(d=>[d.no,d.date,fm(d.total),canDel()?`<button class="d" onclick="del('${d.id}');ctd('${i}')">حذف</button>`:'']))}<h3>زيارات الفحص والتقارير</h3>${tbl(['التاريخ','تقرير الفحص','الزيارة القادمة',''],(c.visits||[]).map((v,j)=>[v.date,esc(v.report),v.next||'—',`<button class="d" onclick="D.ct.find(x=>x.id=='${i}').visits.splice(${j},1);save();ctd('${i}')">حذف</button>`]))}<p class="noprint"><button class="p" onclick="cvi('${i}')">➕ زيارة / تقرير</button> <button onclick="print()">🖨️ طباعة</button> <button onclick="mc()">إغلاق</button></p>`)}
const cvi=i=>form('زيارة فحص',[['date','تاريخ الزيارة','date',0,today()],['report','تقرير الفحص / الملاحظات','text'],['next','موعد الزيارة القادمة','date']],o=>{D.ct.find(x=>x.id==i).visits.push(o);alog('زيارة فحص');setTimeout(()=>ctd(i))});
const agg=()=>{const m={};D.d.filter(d=>(d.t=='sale'||d.t=='sret')&&inR(d)).forEach(d=>d.L.forEach(l=>{const a=m[l.n]=m[l.n]||[0,0],k=d.t=='sale'?1:-1;a[0]+=k*l.q;a[1]+=k*l.q*l.pr}));return m};
Object.assign(RP,{top:['أكثر المنتجات مبيعًا',()=>[['المنتج','الكمية','المبيعات'],Object.entries(agg()).sort((a,b)=>b[1][0]-a[1][0]).slice(0,20).map(([k,v])=>[esc(k),v[0],fm(v[1])])]],
least:['أقل المنتجات مبيعًا',()=>{const m=agg();return[['المنتج','الكمية','المخزون'],D.p.map(p=>[esc(p.name),(m[p.name]||[0])[0],stock(p)]).sort((a,b)=>a[1]-b[1]).slice(0,20)]}],
topc:['أعلى العملاء شراءً',()=>{const m={};D.d.filter(d=>d.t=='sale'&&inR(d)).forEach(d=>{const n=d.party?nm(D.c,d.party):'نقدي';m[n]=(m[n]||0)+d.total});return[['العميل','المشتريات'],Object.entries(m).sort((a,b)=>b[1]-a[1]).slice(0,20).map(([k,v])=>[esc(k),fm(v)])]}],
mom:['مقارنة شهر بشهر',()=>{const m={};D.d.forEach(d=>{const k=d.date.slice(0,7),a=m[k]=m[k]||[0,0,0];if(d.t=='sale')a[0]+=d.total;if(d.t=='purchase')a[1]+=d.total;if(d.t=='ex')a[2]+=d.total});const ks=Object.keys(m).sort();return[['الشهر','المبيعات','المشتريات','المصروفات','تغير المبيعات'],ks.map((k,i)=>{const p=i?m[ks[i-1]][0]:0;return[k,fm(m[k][0]),fm(m[k][1]),fm(m[k][2]),i&&p?((m[k][0]-p)/p*100).toFixed(1)+'%':'—']}).reverse()]}],
reorder:['اقتراح كميات الشراء',()=>[['المنتج','المخزون','حد الطلب','مبيعات 30 يومًا','الكمية المقترحة','المورد'],D.p.filter(p=>sug(p)>0).map(p=>[esc(p.name),stock(p),p.min,sold30(p),sug(p),esc(nm(D.s,p.sup))])]],
slow:['المنتجات بطيئة الحركة',()=>[['المنتج','المخزون','قيمة راكدة'],D.p.filter(slow).map(p=>[esc(p.name),stock(p),fm(stock(p)*p.buy)])]],
void:['الفواتير الملغاة',()=>[['الرقم','النوع','التاريخ','الإجمالي','السبب','ألغاها'],D.vd.map(d=>[d.no,T[d.t],d.date,fm(d.total),esc(d.vr),esc(d.vb)])]]});
/* USERS */
V.users=()=>`<div class="row"><button class="p" onclick="nu()">➕ مستخدم</button></div><div class="c">${tbl(['المستخدم','الدور','كلمة المرور','الصلاحيات',''],D.u.map(u=>[esc(u.name),RL[u.role],u.h?'✔ محددة':'<span class=bad>لم تُحدد</span>',ACC[u.role]=='all'?'كل الأقسام'+(u.role=='admin'?' + المستخدمون':''):ACC[u.role].map(x=>NAV.find(n=>n[0]==x)[1]).join('، '),`<button onclick="rp('${u.id}')">🔑 إعادة تعيين</button> ${u.id!=cu&&(u.role!='admin'||D.u.filter(x=>x.role=='admin').length>1)?`<button class="d" onclick="if(confirm('حذف المستخدم؟')){D.u=D.u.filter(x=>x.id!='${u.id}');save();render()}">حذف</button>`:''}`]))}</div>
<div class="c"><h2>📜 سجل النشاط</h2>${tbl(['الوقت','المستخدم','العملية'],[...D.log].reverse().slice(0,40).map(l=>[l.t,esc(l.u),esc(l.a)]))}</div>
<div class="c"><h2>🔐 نسخ احتياطي واستعادة</h2><p>البيانات تُحفظ في متصفح هذا الجهاز فقط. انسخ النص واحفظه في ملف للنسخ الاحتياطي (يتضمن بصمات كلمات المرور فاحفظه بعناية)، أو الصق نسخة سابقة ثم اضغط استعادة.</p><textarea id="bk" style="width:100%;height:110px">${esc(JSON.stringify(D))}</textarea><p><button class="p" onclick="try{D=JSON.parse($('#bk').value);mk();save();applySt();out()}catch(e){toast('نص غير صالح')}">استعادة</button> <button class="d" onclick="if(confirm('مسح كل البيانات التشغيلية؟ (المستخدمون يبقون)')){D={...seed(),p:[],c:[],s:[],b:[],u:D.u,log:D.log,st:D.st};mk();save();render()}">مسح البيانات</button></p></div>`;
const pr=()=>{const[h,r]=RP[rep][1]();mo(`<h2>${RP[rep][0]} ${r1?'من '+r1:''} ${r2?'إلى '+r2:''}</h2>`+tbl(h,r)+`<p class="noprint"><button class="p" onclick="print()">🖨️ طباعة</button> <button onclick="mc()">إغلاق</button></p>`)};
/* LOGIN */
async function hs(p,s){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s+p));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){let h=5381;for(const c of s+p)h=(h*33^c.charCodeAt(0))>>>0;return'x'+h}}
const alog=(a,u)=>{D.log.push({t:new Date().toLocaleString('en-GB'),u:u||me().name,a});if(D.log.length>300)D.log.shift();save()};
const pw=async(u,p)=>{u.s=id()+id();u.h=await hs(p,u.s);delete u.hf;delete u.mc};
const fcp=()=>form('اختر كلمة مرور جديدة (مطلوب للمتابعة)',[['n','كلمة المرور الجديدة (6+)','password']],async o=>{if(o.n.length<6){toast('6 أحرف على الأقل');return false}await pw(me(),o.n);alog('تغيير كلمة المرور الأولية')});
function lgn(){mc();$('#main').innerHTML='';$('#nav').innerHTML='';$('#lo').innerHTML=`<div class="lc"><h1>${D.st.logo?`<img src="${D.st.logo}" style="max-height:56px;width:auto;margin:0 0 8px">`:'🏢 '}${esc(cn())}</h1><p style="color:var(--mut);margin:0 0 12px">سجّل الدخول للمتابعة</p><label>المستخدم</label><select id="lu" onchange="lgn2()">${D.u.map(u=>`<option value="${u.id}">${esc(u.name)}</option>`).join('')}</select><div id="lf"></div><p id="le" class="bad"></p></div>`;lgn2()}
function lgn2(){const u=D.u.find(x=>x.id==$('#lu').value),k='onkeydown="event.key==\'Enter\'&&dl()"';$('#lf').innerHTML=u.h?`<label>كلمة المرور</label><input id="lp" type="password" ${k}><button class="p" onclick="dl()">دخول</button>`:`<p style="font-size:12px">أول دخول لهذا الحساب: اختر كلمة مرور (6 أحرف على الأقل)</p><input id="lp" type="password" placeholder="كلمة المرور"><input id="lp2" type="password" placeholder="تأكيد كلمة المرور" ${k}><button class="p" onclick="dl()">حفظ ودخول</button>`;$('#le').textContent=''}
async function dl(){const u=D.u.find(x=>x.id==$('#lu').value),p=$('#lp').value,e=$('#le');
if(Date.now()<lock)return e.textContent='محاولات كثيرة، انتظر 30 ثانية';
if(!u.h){if(p.length<6)return e.textContent='كلمة المرور 6 أحرف على الأقل';if(p!=$('#lp2').value)return e.textContent='التأكيد غير مطابق';await pw(u,p)}
else if(![u.h,u.hf].includes(await hs(p,u.s))){alog('محاولة دخول فاشلة',u.name);if(++fails>=5){lock=Date.now()+3e4;fails=0}return e.textContent='كلمة المرور غير صحيحة'}
cu=u.id;fails=0;try{sessionStorage.setItem('amn_s',cu)}catch(x){}$('#lo').innerHTML='';alog('تسجيل دخول');go('dash')}
function out(){if(cu)alog('تسجيل خروج');cu='';try{sessionStorage.removeItem('amn_s')}catch(e){}lgn()}
const cp=()=>form('تغيير كلمة المرور',[['o','الحالية','password'],['n','الجديدة (6+)','password']],async o=>{const u=me();if(await hs(o.o,u.s)!=u.h){toast('كلمة المرور الحالية خاطئة');return false}if(o.n.length<6){toast('6 أحرف على الأقل');return false}await pw(u,o.n);alog('تغيير كلمة المرور')});
const rp=i=>form('كلمة مرور جديدة',[['n','كلمة المرور (6+)','password']],async o=>{if(o.n.length<6){toast('6 أحرف على الأقل');return false}const u=D.u.find(x=>x.id==i);await pw(u,o.n);alog('إعادة تعيين كلمة مرور '+u.name)});
const nu=()=>form('مستخدم جديد',[['name','الاسم','text'],['role','الدور','sel',Object.entries(RL)],['pw','كلمة المرور (6+)','password']],async o=>{if(!o.name||o.pw.length<6){toast('الاسم مطلوب وكلمة المرور 6 أحرف على الأقل');return false}const u={id:id(),name:o.name,role:o.role};await pw(u,o.pw);D.u.push(u);alog('إضافة مستخدم '+o.name)});
mk();applySt();try{cu=sessionStorage.getItem('amn_s')||''}catch(e){}if(!D.u.some(u=>u.id==cu))cu='';
addEventListener('click',()=>idle=Date.now());addEventListener('keydown',()=>idle=Date.now());setInterval(()=>{if(cu&&Date.now()-idle>6e5){out();toast('انتهت الجلسة لعدم النشاط')}},3e4);
cu?render():lgn();
</script></body></html>
